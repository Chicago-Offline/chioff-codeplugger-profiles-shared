# yaml-language-server: $schema=https://raw.githubusercontent.com/Chicago-Offline/codeplugger/main/schemas/instance-registry-0.1.schema.json
# instances.yml — Chicago Offline shared radio registry
#
# Physical radios carrying the SHARED community-net codeplug, keyed by the
# `radio_instance` value used in profiles/**/*.yml.
#
# Scope: this registry is for radios programmed with the ChiOff shared
# profiles. Operators' personal codeplugs (family net, hotspot talkgroups,
# ham repeater sets) live in their OWN private profile repos and are NOT
# described here — see emuehlstein/muehlstein-codeplugger-profiles.
#
# A radio can appear in both: the same handset may be programmed with the
# shared community zone and with a personal codeplug at different times.
# `profile` below records the SHARED profile it is registered against.
#
# Note: `firmware`, `owner`, and `installed_codeplug` are omitted where
# unknown rather than set to null — the 0.1 schema types these as strings,
# so an explicit null fails validation. Absent means "not recorded yet".

$schema: "https://raw.githubusercontent.com/Chicago-Offline/codeplugger/main/schemas/instance-registry-0.1.schema.json"
version: "0.1"

