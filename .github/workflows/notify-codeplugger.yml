name: Notify codeplugger

# codeplugger publishes prebuilt codeplugs from these profiles, so a change here
# has to rebuild its site. Its pages.yml accepts a `sources-changed` dispatch;
# the nightly run there is the backstop if this is ever not configured.
#
# GITHUB_TOKEN cannot dispatch to another repository. CODEPLUGGER_DISPATCH_TOKEN
# is a fine-grained PAT with Contents: read and write on
# Chicago-Offline/codeplugger only, set as an organization secret.

on:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - ".github/workflows/notify-codeplugger.yml"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send sources-changed to codeplugger
        env:
          GH_TOKEN: ${{ secrets.CODEPLUGGER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CODEPLUGGER_DISPATCH_TOKEN is not set; codeplugger will rebuild on its nightly run instead"
            exit 1
          fi
          gh api repos/Chicago-Offline/codeplugger/dispatches \
            --method POST \
            -f event_type=sources-changed \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
