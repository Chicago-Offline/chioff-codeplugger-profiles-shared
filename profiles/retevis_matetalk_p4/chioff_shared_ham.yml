# yaml-language-server: $schema=https://raw.githubusercontent.com/Chicago-Offline/codeplugger/5d2326610d8cae333d85a2e8f637cb755975aedd/schemas/profile-0.1.schema.json

$schema: "https://raw.githubusercontent.com/Chicago-Offline/codeplugger/5d2326610d8cae333d85a2e8f637cb755975aedd/schemas/profile-0.1.schema.json"
version: "0.1"
id: "chioff_p4_shared_ham"
name: "Chicago Offline Shared + Ham - Retevis MateTalk P4"
radio: "retevis_matetalk_p4"
# Shared ChiOff community net and UHF amateur simplex configuration for the
# Retevis MateTalk P4. The P4 is UHF-only (400-470 MHz).
#
# No radio_instance: this is a community profile, not tied to one operator's
# handset.
zones:
  # 6 channels: analog GMRS simplex + road + the repeater pair.
  - id: "chioff_gmrs"
    name: "ChiOff"
    assignments:
      - "asg_chio_all"
      - "asg_chio_team1"
      - "asg_chio_team2"
      - "asg_chio_team3"
      - "asg_chio_road"
      - "asg_chio_repeater"
  # 10 channels: 5 analog UHF amateur simplex, then their DMR equivalents.
  - id: "chioff_ham"
    name: "ChiOff Ham"
    assignments:
      - "us_ham_uhf_call"
      - "us_ham_uhf_446025"
      - "us_ham_uhf_446050"
      - "us_ham_uhf_446075"
      - "us_ham_uhf_446100"
      - "asg_chio_dmr_uhf_call"
      - "asg_chio_dmr_uhf_446025"
      - "asg_chio_dmr_uhf_446050"
      - "asg_chio_dmr_uhf_446075"
      - "asg_chio_dmr_uhf_446100"