# yaml-language-server: $schema=https://raw.githubusercontent.com/Chicago-Offline/codeplugger/5d2326610d8cae333d85a2e8f637cb755975aedd/schemas/profile-0.1.schema.json

$schema: "https://raw.githubusercontent.com/Chicago-Offline/codeplugger/5d2326610d8cae333d85a2e8f637cb755975aedd/schemas/profile-0.1.schema.json"
version: "0.1"
id: "chioff_dm32_chicago"
name: "Chicago Offline - DM-32 Chicago"
radio: "baofeng_dm32"
# The full-featured Chicago codeplug for the Baofeng DM-32: the shared
# community net plus local amateur, GMRS, public safety, public works,
# transit, business, venue, aviation, marine and weather channels.
#
# Everything here resolves from public data -- ssrf-lite plus the shared
# ChiOff overlay -- so this profile can be published and rebuilt by CI. No
# personal DMR IDs and no private overlay records.
#
# Not included, deliberately:
#
#   * The 1.25 m, 23 cm, 6 m and 10 m entries carried by the club files, and
#     every D-STAR, C4FM, P25, APRS, packet and CW channel. The DM-32 has
#     neither the bands nor the modes; codeplugger rejects them rather than
#     emitting a channel the radio cannot use.
#   * The KC9MHE family operations channels. They are public in ssrf-lite but
#     they are one family's channels, not community infrastructure.
#
# The ChiOff GMRS and MURS zones are copied from chioff_shared.yml rather
# than inherited: profile-0.1 requires a child profile to declare a
# radio_instance, and a community profile has none. Keep the two in sync.
#
# No radio_instance: this is a community profile, not tied to one operator's
# handset.
zones:
  # The shared community net, copied from chioff_shared.yml -- keep in sync.
  - id: "chioff_gmrs"
    name: "ChiOff GMRS"
    assignments:
      - "asg_chio_all"
      - "asg_chio_team1"
      - "asg_chio_team2"
      - "asg_chio_team3"
      - "asg_chio_road"
      - "asg_chio_repeater"
